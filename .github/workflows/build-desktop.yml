name: Build local desktop apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choose release version
        id: version
        run: node packaging/release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-14
            arch: arm64
          - target: win-x64
            runner: windows-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gpm-tool/package-lock.json
      - name: Apply release version to build
        run: node packaging/release-version.mjs --apply ${{ needs.prepare.outputs.version }}
      - name: Install build-host dependencies
        working-directory: gpm-tool
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'win-x64'
        with:
          dotnet-version: 10.0.x
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node packaging/validate-tag.mjs
      - name: Build DMG
        if: startsWith(matrix.target, 'mac-')
        run: node packaging/macos/build.mjs
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          GPM_UPDATE_REPOSITORY: ${{ github.repository }}
      - name: Install NSIS
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build Windows portable EXE
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: node packaging/windows/build.mjs
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
          NSISDIR: C:\Program Files (x86)\NSIS
          GPM_UPDATE_REPOSITORY: ${{ github.repository }}
      - name: Upload app files
        uses: actions/upload-artifact@v4
        with:
          name: HoanXu-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HoanXu-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its published files."
          else
            gh release create "$RELEASE_TAG" release/* --target "$RELEASE_COMMIT" --title "HoanXu GPM $RELEASE_TAG" --generate-notes --latest
          fi
