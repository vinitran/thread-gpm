name: Build local desktop apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choose release version
        id: version
        run: node packaging/release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reserve shared release
        if: steps.version.outputs.publish == 'true'
        run: node packaging/platform-release.mjs reserve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}

  macos:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  windows:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
